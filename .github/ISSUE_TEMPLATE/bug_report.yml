name: Bug report
description: Something in Visor doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a security problem?** Don't open an issue: report it privately as [SECURITY.md](https://github.com/touhidurabir/visor/blob/main/SECURITY.md) explains.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues, and this isn't one of them.
          required: true
        - label: This isn't a security problem.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. …
        2. …
  - type: input
    id: visor
    attributes:
      label: Visor version
      description: "On macOS, Visor → About Visor. On Linux, `dpkg -s visor`, `rpm -q visor`, or the AppImage's file name"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: "macOS version (e.g. macOS 15.4), or on Linux the distro, desktop and package (e.g. Ubuntu 24.04, GNOME, .deb)"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - supervisord on this computer
        - A server over SSH
        - The MCP server (an AI tool)
        - Not sure
    validations:
      required: true
  - type: input
    id: supervisord
    attributes:
      label: supervisord version
      description: "`supervisord --version`"
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The program's config file, if it matters. This is public, so first remove passwords, `environment=` values, tokens and private paths.
      render: ini
  - type: textarea
    id: doctor
    attributes:
      label: What Doctor says
      description: If Visor can't connect, what Doctor shows (**Help › Doctor**). Remove anything private first.
