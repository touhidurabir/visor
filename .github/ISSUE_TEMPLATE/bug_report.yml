name: Bug report
description: Something in Visor doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. …
        2. …
  - type: input
    id: visor
    attributes:
      label: Visor version
      description: Visor → About Visor
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: "macOS version (e.g. macOS 15.4), or on Linux the distro, desktop and package (e.g. Ubuntu 24.04, GNOME, .deb)"
    validations:
      required: true
  - type: input
    id: supervisord
    attributes:
      label: supervisord version
      description: "`supervisord --version`"
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The program's config file, if it matters. Remove passwords and private paths first.
      render: ini
