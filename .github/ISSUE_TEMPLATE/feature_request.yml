name: Idea
description: Something Visor could do better or do next
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues, and nobody has asked for this yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation you're in and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like Visor to handle it, if you have an idea.
