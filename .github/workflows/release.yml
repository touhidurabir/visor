name: Release

# A version tag builds the Mac and Linux downloads and creates a draft GitHub
# release for the maintainer to publish:
#   mac:     a universal Visor.app in Visor-<v>-universal.dmg
#   linux:   Visor-<v>-x86_64.AppImage, visor_<v>_amd64.deb, visor-<v>-1.x86_64.rpm
#   publish: a .sha256 beside each, and the draft release (tags only)
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds
# everything as version 0.0.0-dryrun.<run> and keeps the files as workflow
# artifacts, with no release. Never runs for pull requests.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      bundle: ${{ steps.v.outputs.bundle }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS wants plain numbers (1.2.3) in the bundle versions, so a
      # pre-release tag (v1.1.0-beta.1) stamps 1.1.0 there and the release is
      # marked as a pre-release.
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dryrun.$GITHUB_RUN_NUMBER"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME isn't vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          bundle="${version%%-*}"
          # The tag must match the version the code carries (version.go).
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -qx "const version = \"$bundle\"" version.go; then
            echo "Tag $GITHUB_REF_NAME doesn't match version.go ($(grep '^const version' version.go))" >&2
            exit 1
          fi
          prerelease=0
          if [ "$bundle" != "$version" ]; then prerelease=1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUNDLE: ${{ needs.version.outputs.bundle }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config, where npm and go install
          # scripts could use it.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A tag that never passed CI must not ship. -short skips the tests that
      # need a real supervisord (CI runs those on every push).
      - name: Run the tests
        run: |
          go vet ./...
          go test -short ./...
          npm --prefix frontend run typecheck
          npm --prefix frontend test

      - name: Stamp the version
        run: |
          plutil -replace CFBundleShortVersionString -string "$BUNDLE" build/darwin/Info.plist
          plutil -replace CFBundleVersion -string "$BUNDLE" build/darwin/Info.plist

      # Developer ID signing and notarization run only when every secret is
      # set. Without them the app is ad-hoc signed (unsigned for Gatekeeper)
      # and the release notes say so. The signed path is untested until a
      # Developer ID exists.
      - name: Decide how to sign
        id: sign
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PASSWORD" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "$P12_PASSWORD" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$P12_PASSWORD" "$keychain"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
            security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/id.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the universal app
        run: wails3 task darwin:package:universal SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Sign with Developer ID and notarize
        if: env.SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$SIGN_IDENTITY" bin/visor.app
          ditto -c -k --keepParent bin/visor.app "$RUNNER_TEMP/visor.zip"
          xcrun notarytool submit "$RUNNER_TEMP/visor.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple bin/visor.app

      # release-dmg.sh writes the .dmg and its .sha256.
      - name: Pack the disk image
        run: scripts/release-dmg.sh bin/visor.app "$VERSION" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The AppImage bundles GTK and WebKitGTK from here, so it is built on
      # the oldest target (Ubuntu 24.04). linuxdeploy runs with
      # --appimage-extract-and-run, so no FUSE is needed.
      - name: Install GTK 4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev file

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the tests
        run: |
          go vet ./...
          go test -short ./...

      - name: Build the AppImage, .deb and .rpm
        run: VISOR_VERSION="$VERSION" wails3 task linux:package

      - name: Name the files
        run: |
          mkdir dist
          mv bin/visor-x86_64.AppImage "dist/Visor-$VERSION-x86_64.AppImage"
          mv bin/visor.deb "dist/visor_${VERSION}_amd64.deb"
          mv bin/visor.rpm "dist/visor-$VERSION-1.x86_64.rpm"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, mac, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      SIGNED: ${{ needs.mac.outputs.signed }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        working-directory: dist
        run: |
          for f in *.AppImage *.deb *.rpm; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = 1 ]; then
            note="The Mac build is signed and notarized by Apple."
          else
            note="The Mac build isn't signed by Apple yet. See [Install](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#install) for how to open it the first time."
          fi
          pre=()
          if [ "$PRERELEASE" = 1 ]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" --title "Visor $VERSION" --notes "$note

          Linux: the AppImage runs on Ubuntu 24.04+ and Fedora 40+ (\`chmod +x\` it first); the .deb and .rpm install Visor for the whole system. See [Install](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#install).

          Check a download: \`shasum -a 256 -c <file>.sha256\` on a Mac, \`sha256sum -c <file>.sha256\` on Linux."
