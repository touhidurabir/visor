name: CI

# Pull requests (every push to the PR branch) and main only, so a PR branch
# isn't checked twice per push. A push that changes only docs runs nothing.
# Minutes: the repo is private, where a macOS minute counts ten times, so
# the macOS job runs on main, by hand (Actions → CI → Run workflow) and on a
# PR labelled "macos"; PRs otherwise get the two Linux jobs.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run of the previous one on the same branch. A run
# started by a label is its own group, so it never cancels a push's run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

jobs:
  check:
    # The Mac checks (the macOS build, cgo and the Mac-only code): on main, by
    # hand, or on a PR with the "macos" label. Release runs its own Mac tests.
    # Adding another label runs nothing; adding "macos" runs just this job.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'macos') &&
       (github.event.action != 'labeled' || github.event.label.name == 'macos'))
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist/.gitkeep is tracked, so go:embed compiles without a
      # frontend build.
      - name: Go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Install supervisor
        run: brew install supervisor

      - name: Go tests
        run: go test -race ./...

      - name: Core packages do not import Wails
        run: scripts/check-core-imports.sh

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  # The same checks on Linux, plus a native CGO build against GTK 4 and
  # WebKitGTK 6.0 (Ubuntu 24.04's packages).
  linux:
    # Labelling a PR doesn't change its code: no need to run again.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK 4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Install supervisor
        # The same pins as the e2e job (setuptools 82 dropped pkg_resources).
        run: |
          pipx install supervisor==4.2.5
          pipx runpip supervisor install setuptools==81.0.0
          supervisord --version

      - name: Go tests
        run: go test -race ./...

      - name: Core packages do not import Wails
        run: scripts/check-core-imports.sh

      - name: Native build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          go build -tags production -trimpath -o bin/visor .
          file bin/visor

  # UI tests: Playwright (WebKit) against the server-mode build and a
  # throwaway supervisord under /tmp/visor-e2e.
  e2e:
    # Labelling a PR doesn't change its code: no need to run again.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install supervisor
        # supervisor 4.2.5 imports pkg_resources, which setuptools 82 removed.
        # pipx puts the latest setuptools in the venv and `pipx inject` won't
        # replace it, so pin it with pip inside the venv.
        run: |
          pipx install supervisor==4.2.5
          pipx runpip supervisor install setuptools==81.0.0
          supervisord --version

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the server-mode binary and the test SSH server
        run: |
          CGO_ENABLED=0 go build -tags server -o bin/visor-e2e .
          CGO_ENABLED=0 go build -o bin/visor-e2e-ssh ./internal/remote/remotetest/cmd/visor-e2e-ssh

      - name: Install Playwright and WebKit
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: UI tests
        working-directory: e2e
        env:
          CI: 'true'
        run: npm test

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/visor-server.log
          retention-days: 7
