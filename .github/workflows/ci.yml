name: CI

# Pull requests (every push to the PR branch) and main only, so a PR branch
# isn't checked twice per push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist/.gitkeep is tracked, so go:embed compiles without a
      # frontend build.
      - name: Go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Install supervisor
        run: brew install supervisor

      - name: Go tests
        run: go test -race ./...

      - name: Core packages do not import Wails
        run: scripts/check-core-imports.sh

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  # The same checks on Linux, plus a native CGO build against GTK 4 and
  # WebKitGTK 6.0 (Ubuntu 24.04's packages).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK 4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Install supervisor
        # The same pins as the e2e job (setuptools 82 dropped pkg_resources).
        run: |
          pipx install supervisor==4.2.5
          pipx runpip supervisor install setuptools==81.0.0
          supervisord --version

      - name: Go tests
        run: go test -race ./...

      - name: Core packages do not import Wails
        run: scripts/check-core-imports.sh

      - name: Native build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          go build -tags production -trimpath -o bin/visor .
          file bin/visor

  # UI tests: Playwright (WebKit) against the server-mode build and a
  # throwaway supervisord under /tmp/visor-e2e.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install supervisor
        # supervisor 4.2.5 imports pkg_resources, which setuptools 82 removed.
        # pipx puts the latest setuptools in the venv and `pipx inject` won't
        # replace it, so pin it with pip inside the venv.
        run: |
          pipx install supervisor==4.2.5
          pipx runpip supervisor install setuptools==81.0.0
          supervisord --version

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the server-mode binary
        run: CGO_ENABLED=0 go build -tags server -o bin/visor-e2e .

      - name: Install Playwright and WebKit
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: UI tests
        working-directory: e2e
        env:
          CI: 'true'
        run: npm test

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/visor-server.log
          retention-days: 7
