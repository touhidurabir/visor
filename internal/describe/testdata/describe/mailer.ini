[program:mailer-worker]
command=php artisan queue:work --sleep=3 --tries=3
directory=/srv/mailer
user=www
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/srv/mailer/storage/logs/worker.log
stdout_logfile_maxbytes=50MB

[program:mailer-digest]
command=php artisan digest:send --daemon
directory=/srv/mailer
autorestart=true
startsecs=1
startretries=3
stdout_logfile=/srv/mailer/storage/logs/digest.log
