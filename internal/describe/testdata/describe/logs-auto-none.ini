[program:acme-auto]
command=node server.js
stdout_logfile=AUTO
stderr_logfile=AUTO
startsecs=5

[program:acme-quiet]
command=node quiet.js
stdout_logfile=NONE
stderr_logfile=NONE
startsecs=5

[program:acme-merged-quiet]
command=node merged.js
redirect_stderr=true
stdout_logfile=NONE
startsecs=5

[program:acme-split]
command=node split.js
stdout_logfile=/var/log/acme/out.log
stderr_logfile=/var/log/acme/err.log
startsecs=5

[program:acme-auto-out]
command=node auto-out.js
redirect_stderr=true
startsecs=5
