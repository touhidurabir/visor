; queue workers for acme
[program:acme-queue]
command=php artisan queue:work redis --queue=high,default --tries=3 --max-time=3600
directory=/srv/acme
numprocs=3
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/acme/queue.log
stdout_logfile_maxbytes=0
environment=APP_ENV="production",
    QUEUE="high"
autorestrat=true

[group:acme]
programs=acme-queue
