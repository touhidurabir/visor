; A Laravel app with workers and an Artisan command of its own.
[program:cms-watcher]
command=php /srv/cms/artisan ocpp:watch-ceilings
process_name=%(program_name)s
autostart=true
autorestart=true
stdout_logfile=/var/log/cms/watcher.log
redirect_stderr=true

[program:cms-queue]
command=php /srv/cms/artisan queue:work --queue=high,default --tries=3
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/cms/queue.log
redirect_stderr=true

[group:cms]
programs=cms-watcher,cms-queue
priority=10
