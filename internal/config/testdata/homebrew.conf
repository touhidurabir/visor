; Homebrew-style supervisord.conf
[unix_http_server]
file=/opt/test/var/run/supervisor.sock   ; the path to the socket file

[supervisord]
logfile=/opt/test/var/log/supervisord.log ; main log file
pidfile=/opt/test/var/run/supervisord.pid ; pidfile
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/test/var/run/supervisor.sock ; use a unix:// URL

[include]
files = /opt/test/etc/supervisor.d/*.ini
