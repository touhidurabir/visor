<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong
      // one. Mirrors lib/theme.ts: the cached choice, else the OS.
      ;(function () {
        var a = 'system'
        try {
          a = localStorage.getItem('visor.appearance') || 'system'
        } catch (e) {}
        var dark = a === 'dark' || (a !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var t = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
