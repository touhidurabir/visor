# The .deb and .rpm (nfpm, through `wails3 tool package`). Built by
# `wails3 task linux:package`; the release workflow sets VISOR_VERSION.
# https://nfpm.goreleaser.com

name: "visor"
arch: "${GOARCH}"
platform: "linux"
version: "${VISOR_VERSION}"
release: "1"
section: "admin"
priority: "optional"
maintainer: "Touhidur Rahman <noreply@getvisor.dev>"
description: |
  A menu-bar and tray app for managing supervisord.
  Visor shows every process supervisord runs, starts, stops and restarts
  them, tails their logs, and adds and edits program configs safely.
vendor: "Touhidur Rahman"
homepage: "https://getvisor.dev"
license: "MIT"

contents:
  - src: "./bin/visor"
    dst: "/usr/bin/visor"
    file_info:
      mode: 0755
  - src: "./build/linux/dev.getvisor.visor.desktop"
    dst: "/usr/share/applications/dev.getvisor.visor.desktop"
  - src: "./build/linux/icons/16.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/24.png"
    dst: "/usr/share/icons/hicolor/24x24/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/32.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/48.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/64.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/128.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/dev.getvisor.visor.png"
  - src: "./build/linux/icons/512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/dev.getvisor.visor.png"
  # Ubuntu 23.10+ lets a program make user namespaces only with an
  # AppArmor profile, and WebKit's sandbox needs one (otherwise the window
  # crashes as it opens). Fedora has no such rule.
  - src: "./build/linux/apparmor/dev.getvisor.visor"
    dst: "/etc/apparmor.d/dev.getvisor.visor"
    type: config
    packager: deb

# GTK 4 and WebKitGTK 6.0 (Ubuntu 24.04+, Debian 13+), and the tray's
# StatusNotifier support comes with the desktop.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
recommends:
  - gnome-shell-extension-appindicator

overrides:
  # Fedora 40+ / RHEL
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
